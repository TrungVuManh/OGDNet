name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt pytest==8.3.5
      - run: python -m compileall -q methods utils scripts train.py evaluate.py predict.py ogdnet.py
      - run: python -m pytest -q
